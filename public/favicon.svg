<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The avatar, clipped to a circle so the icon reads as a disc on any
       tab bar rather than a square with white corners. -->
  <defs>
    <clipPath id="c"><circle cx="64" cy="64" r="64"/></clipPath>
  </defs>
  <image href="data:image/png;base64," width="128" height="128" clip-path="url(#c)"/>
</svg>

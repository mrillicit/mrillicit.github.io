<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The avatar, clipped to a circle so the tab shows a disc rather than a
       square with white corners. The source art is a photograph-style JPEG,
       which encodes far smaller than PNG here, so it is embedded as JPEG. -->
  <defs>
    <clipPath id="c"><circle cx="64" cy="64" r="64"/></clipPath>
  </defs>
  <image href="data:image/jpeg;base64," width="128" height="128"
         preserveAspectRatio="xMidYMid slice" clip-path="url(#c)"/>
</svg>
